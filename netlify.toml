[build]
  command = "cd web-app && npm install && npm run build"
  publish = "web-app/dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/save-vocab"
  to = "/.netlify/functions/save-vocab"
  status = 200

[[redirects]]
  from = "/api/youtube"
  to = "/.netlify/functions/youtube"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
