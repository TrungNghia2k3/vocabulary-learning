<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VocabStudio — Học Từ Vựng Tiếng Anh từ Google Sheets</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <script>
      try {
        if (localStorage.getItem('vocabStudio:darkMode') === 'true') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      #boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        color: #334155;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html.dark #boot-splash {
        background: #020617;
        color: #cbd5e1;
      }
      .boot-spinner {
        width: 38px;
        height: 38px;
        border-radius: 9999px;
        border: 3.5px solid rgba(99, 102, 241, 0.2);
        border-top-color: #4f46e5;
        animation: boot-spin 0.75s linear infinite;
      }
      html.dark .boot-spinner {
        border-color: rgba(129, 140, 248, 0.22);
        border-top-color: #818cf8;
      }
      .boot-label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        opacity: 0.85;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <div class="boot-spinner"></div>
        <div class="boot-label">Đang tải VocabStudio...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
